name: Preview voz US (horóscopo diário)

# Só manual — evita gastar minutos GitHub Actions em cada merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar FFmpeg e dependências Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chrome para Remotion
        run: npx remotion browser ensure

      - name: Gerar previews US (feminina + masculina)
        run: LOCALE=en-US npx ts-node scripts/gerar-preview-us-diario.ts
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: northeurope
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          STORAGE_PROVIDER: cloudinary
