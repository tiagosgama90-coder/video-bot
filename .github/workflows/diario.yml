name: Horóscopo Diário SidusAstro

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  gerar-e-publicar:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar FFmpeg
        run: choco install ffmpeg -y

      - name: Instalar dependências
        run: npm ci

      - name: Validar secrets obrigatórios
        shell: pwsh
        run: |
          $obrigatorios = @(
            'FIREBASE_ADMIN_JSON',
            'BUFFER_ACCESS_TOKEN',
            'BUFFER_INSTAGRAM_CHANNEL_ID',
            'BUFFER_TIKTOK_CHANNEL_ID',
            'FIREBASE_STORAGE_BUCKET',
            'AZURE_SPEECH_KEY'
          )
          $faltam = @()
          foreach ($nome in $obrigatorios) {
            $valor = [Environment]::GetEnvironmentVariable($nome)
            if ([string]::IsNullOrWhiteSpace($valor)) { $faltam += $nome }
          }
          if ($faltam.Count -gt 0) {
            Write-Error "Secrets em falta no GitHub: $($faltam -join ', ')"
            exit 1
          }
        env:
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}

      - name: Configurar credenciais Firebase
        shell: pwsh
        run: |
          $env:FIREBASE_ADMIN_JSON | Set-Content -Path firebase-admin.json -Encoding utf8 -NoNewline
          node -e "JSON.parse(require('fs').readFileSync('firebase-admin.json','utf8')); console.log('firebase-admin.json OK')"
        env:
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}

      - name: Gerar e publicar vídeos diários
        run: npx ts-node gerar-e-publicar.ts
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          BUFFER_TIKTOK_USERNAME: sidusastro
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: northeurope

      - name: Guardar vídeos como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-diarios
          path: output/*.mp4
          retention-days: 7
