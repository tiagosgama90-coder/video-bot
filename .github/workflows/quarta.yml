name: Vídeo Quarta-feira (Afiliados)

on:
  schedule:
    - cron: '30 6 * * 3' # Quarta 07:30 Lisboa (verão)
  workflow_dispatch:

jobs:
  gerar-afiliados:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar FFmpeg e dependências Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - run: npm ci
      - run: npx remotion browser ensure

      - name: Configurar credenciais Firebase
        run: printf '%s' "$FIREBASE_ADMIN_JSON" > firebase-admin.json
        env:
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}

      - name: Gerar vídeo afiliados
        run: npx ts-node gerar-video-quarta.ts
        env:
          CI: true
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          BUFFER_TIKTOK_USERNAME: sidusastro
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: northeurope

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-afiliados
          path: output/afiliados-quarta.mp4
          retention-days: 7
          if-no-files-found: ignore
