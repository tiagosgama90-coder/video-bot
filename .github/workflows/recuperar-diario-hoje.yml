name: Recuperar Horóscopo Diário (hoje)

# Disparo único via push do ficheiro trigger — remove após recuperação.
on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/disparar-diario-recuperacao'

permissions:
  actions: write
  contents: read

jobs:
  disparar-pt:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Horóscopo Diário PT
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'diario.yml',
              ref: 'main',
            });
            core.info('Workflow diario.yml disparado.');

  disparar-us:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Horóscopo Diário US
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'diario-us.yml',
              ref: 'main',
            });
            core.info('Workflow diario-us.yml disparado.');
