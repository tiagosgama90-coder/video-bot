name: Recuperar Horóscopo Diário (hoje)

# Push em .github/triggers/disparar-diario-recuperacao força nova geração (forcar=true).
on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/disparar-diario-recuperacao'

permissions:
  actions: write
  contents: read

jobs:
  disparar-pt:
    runs-on: ubuntu-latest
    steps:
      - name: Forçar Horóscopo Diário PT (nova geração)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'diario.yml',
              ref: 'main',
              inputs: { forcar: 'true' },
            });
            core.info('Workflow diario.yml disparado com forcar=true.');

  disparar-us:
    runs-on: ubuntu-latest
    steps:
      - name: Forçar Horóscopo Diário US (nova geração)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'diario-us.yml',
              ref: 'main',
              inputs: { forcar: 'true' },
            });
            core.info('Workflow diario-us.yml disparado com forcar=true.');
