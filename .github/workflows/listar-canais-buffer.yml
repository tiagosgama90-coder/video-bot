name: Listar canais Buffer

# Corre no telemóvel: GitHub → Actions → "Listar canais Buffer" → Run workflow
on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Listar canais Buffer (copia o ID do sidusastro_en)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          npm run canais 2>&1 | tee canais-log.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Canais Buffer — copia o ID do sidusastro_en" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat canais-log.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
