name: Horóscopo Diário US (sidusastro_en)

# Primário: cron-job.org às 07:30 America/New_York (scripts/configurar-cron-us.sh).
# Backup: schedule GitHub abaixo + monitor-crons.yml dispara recuperação se ambos falharem.
# Publica TikTok @sidusastro_en (+ Instagram US se BUFFER_INSTAGRAM_US_CHANNEL_ID definido).
# Slots Buffer: 09:00/13:30/19:00 NY — 3 vídeos/dia (ter/sáb: afiliados @09:00 + 2 horóscopos).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'  # ~07:30 America/New_York (EDT)
    - cron: '30 12 * * *'  # ~07:30 America/New_York (EST)

permissions:
  actions: read
  contents: read

jobs:
  evitar-duplicado-schedule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      continuar: ${{ steps.decide.outputs.continuar }}
    steps:
      - name: Saltar backup se o diário US já correu hoje
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const hoje = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'diario-us.yml',
              status: 'success',
              per_page: 20,
            });
            const correu = runs.some((r) =>
              new Date(r.created_at).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }) === hoje,
            );
            core.setOutput('continuar', correu ? 'false' : 'true');
            if (correu) {
              core.info('Diário US já correu hoje (' + hoje + ' NY) — backup schedule ignorado.');
            }

  gerar-e-publicar-us:
    needs: evitar-duplicado-schedule
    if: always() && (github.event_name != 'schedule' || needs.evitar-duplicado-schedule.outputs.continuar == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar FFmpeg e dependências Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chrome para Remotion
        run: npx remotion browser ensure

      - name: Validar secrets obrigatórios (US)
        run: |
          faltam=""
          for nome in FIREBASE_ADMIN_JSON BUFFER_ACCESS_TOKEN BUFFER_TIKTOK_US_CHANNEL_ID FIREBASE_STORAGE_BUCKET AZURE_SPEECH_KEY; do
            eval "valor=\$$nome"
            if [ -z "$valor" ]; then faltam="$faltam $nome"; fi
          done
          if [ -n "$faltam" ]; then
            echo "Secrets em falta:$faltam"
            exit 1
          fi
          echo "Todos os secrets US presentes."
        env:
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_US_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_US_CHANNEL_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}

      - name: Configurar credenciais Firebase
        run: |
          printf '%s' "$FIREBASE_ADMIN_JSON" > firebase-admin.json
          node -e "const j=JSON.parse(require('fs').readFileSync('firebase-admin.json','utf8')); if(!j.project_id||!j.private_key) throw new Error('JSON invalido'); console.log('firebase-admin.json OK — project:', j.project_id)"
        env:
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}

      - name: Gerar e publicar vídeos US (@sidusastro_en)
        run: npx ts-node gerar-e-publicar.ts
        env:
          CI: true
          LOCALE: en-US
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_US_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_US_CHANNEL_ID }}
          BUFFER_INSTAGRAM_US_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_US_CHANNEL_ID }}
          BUFFER_TIKTOK_US_USERNAME: sidusastro_en
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: northeurope

      - name: Guardar vídeos como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-diarios-us
          path: output/*-diario-us.mp4
          retention-days: 7
          if-no-files-found: ignore
